# =====================================================================
# Payra API - local development (dev-only credentials, match infra/)
# =====================================================================


spring.application.name=payra-api

# --- HTTP ---
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/payra
spring.datasource.username=payra
spring.datasource.password=payra

# --- JPA / Hibernate ---
# Schema is owned by Flyway migrations. Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
# Never hold a DB connection while rendering a response.
spring.jpa.open-in-view=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

# --- Actuator --
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
